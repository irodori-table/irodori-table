[advisories]
git-fetch-with-cli = true
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "transitive schema/codegen tooling; tracked in tools/security/rustsec-audit-ignore.txt" },
  { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9 pins libsqlite3-sys <0.38; the fixed 0.39 needs a sqlx release that does not exist yet" },
  { id = "RUSTSEC-2026-0370", reason = "unmaintained zvariant 5 pulled in by zbus 5; merged into zbus 6, which has no Tauri 2 release yet" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained zbus_names 4 pulled in by zbus 5; merged into zbus 6, which has no Tauri 2 release yet" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained zvariant_derive 5 pulled in by zbus 5; merged into zbus 6, which has no Tauri 2 release yet" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/irodori-table/irodori-kit",
  "https://github.com/irodori-table/irodori-knowledge",
  "https://github.com/irodori-table/irodori-sql",
  # Not transferred: this one is still a personal repository, so the owner
  # here is current rather than stale.
  "https://github.com/hjosugi/sql-dialect-fmt",
]
