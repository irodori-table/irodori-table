name: Extension catalog sync

on:
  repository_dispatch:
    types:
      - extension-released
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: extension-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      # `secrets` is not available in a step `if`; surface it as env and test
      # that instead.
      CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
    steps:
      - name: Checkout irodori-table
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Synchronize immutable release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/extensions/sync-release-catalog.mjs --write
          node tools/docs/build-extension-catalog.mjs

      - name: Sign catalog
        if: ${{ env.CATALOG_SIGNING_KEY != '' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$CATALOG_SIGNING_KEY" > "$RUNNER_TEMP/catalog.key"
          # Default (prehashed) signature; the host verifies with
          # allow_legacy=false. The public key goes in
          # extensions/catalog.rs::CATALOG_PUBLIC_KEY.
          minisign -S -s "$RUNNER_TEMP/catalog.key" \
            -m registry/catalog/index.json \
            -x registry/catalog/index.json.minisig
          rm -f "$RUNNER_TEMP/catalog.key"

      - name: Commit catalog update
        shell: bash
        run: |
          # `git status` so a brand-new (untracked) signature file counts too.
          if [ -z "$(git status --porcelain -- registry/catalog apps/desktop/src/features/extensions/bundled-catalog.json)" ]; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/catalog/index.json registry/catalog/catalog.json apps/desktop/src/features/extensions/bundled-catalog.json
          if [ -f registry/catalog/index.json.minisig ]; then
            git add registry/catalog/index.json.minisig
          fi
          git commit -m "chore(extensions): sync release catalog"
          git pull --rebase origin main
          git push origin HEAD:main
