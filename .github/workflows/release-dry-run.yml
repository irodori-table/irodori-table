name: Release dry run

on:
  workflow_dispatch:

jobs:
  linux-packages:
    name: Linux package dry run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout irodori-table
        uses: actions/checkout@v7

      - name: Set up Linux bundling
        uses: ./.github/actions/setup-linux-bundling

      - name: Set up the desktop build toolchain
        uses: ./.github/actions/setup-desktop-toolchain

      - name: Build Linux packages
        working-directory: apps/desktop
        run: npm run release:linux

      - name: Verify Linux package artifacts
        working-directory: apps/desktop
        run: npm run release:verify-linux

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: irodori-table-linux-packages
          path: |
            .irodori-local/target/release/bundle/appimage/*.AppImage
            .irodori-local/target/release/bundle/deb/*.deb
            .irodori-local/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
