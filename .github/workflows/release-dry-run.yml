name: Release dry run

on:
  workflow_dispatch:

jobs:
  linux-packages:
    name: Linux package dry run (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: x86_64
            bundles: appimage,deb,rpm
            appimage_shim: 'true'
            verify_args: ''
          # aarch64 builds deb/rpm only; the AppImage tooling is x86_64-only.
          - os: ubuntu-24.04-arm
            label: aarch64
            bundles: deb,rpm
            appimage_shim: 'false'
            verify_args: --skip-exec
    steps:
      - name: Checkout irodori-table
        uses: actions/checkout@v7

      - name: Set up Linux bundling
        uses: ./.github/actions/setup-linux-bundling
        with:
          appimage_shim: ${{ matrix.appimage_shim }}

      - name: Set up the desktop build toolchain
        uses: ./.github/actions/setup-desktop-toolchain

      - name: Build Linux packages
        working-directory: apps/desktop
        # Match the real release's tauri-action execution path. In particular,
        # this proves setup-linux-bundling protects a direct Tauri invocation;
        # build-linux-release.mjs also installs the shim for local commands.
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.bundle.conf.json

      - name: Verify Linux package artifacts
        working-directory: apps/desktop
        run: npm run release:verify-linux -- --bundles ${{ matrix.bundles }} ${{ matrix.verify_args }}

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: irodori-table-linux-packages-${{ matrix.label }}
          path: |
            .irodori-local/target/release/bundle/appimage/*.AppImage
            .irodori-local/target/release/bundle/deb/*.deb
            .irodori-local/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
