name: Set up Linux bundling
description: >-
  System libraries and the AppImage tooling cache for any job that produces
  Linux desktop packages.

  The build wrapper owns AppImage library exclusion because it must prepare the
  same XDG cache directory that it passes to Tauri (#214).

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          file \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          mold \
          wget

    # build-linux-release.mjs sets XDG_CACHE_HOME to the repo-relative .cache
    # directory, so Tauri downloads linuxdeploy and its plugins here. Keep this
    # path in sync with that wrapper; dirs::cache_dir() observes the override.
    - name: Cache AppImage runtime
      uses: actions/cache@v6
      with:
        path: .cache/tauri
        key: appimage-tools-v2-${{ runner.os }}-${{ runner.arch }}
